[project]
name = "spev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tim Radtke", email = "tim@timradtke.net" }
]
requires-python = ">=3.12"
dependencies = [
    "fev>=0.10.0",
    "numpy>=2.5.4",
]

[project.scripts]
spev = "spev:main"

[project.optional-dependencies]
docs = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "pip>=26.2.2",
    "tqdm>=4.70.1",
]
adapter = [
    "shuffler",
]
models = [
    "chronos-forecasting>=2.3.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
shuffler = { git = "https://github.com/timradtke/shuffler" }
